<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI QA Agent architecture</title>
  <desc>Test cases flow through a Planner LLM, Playwright executor with self-healing, and a Judge LLM that produces an HTML and JSON report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #0f172a; }
      .ts { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #64748b; }
      .th { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: #0f172a; }
      .arr { stroke: #475569; stroke-width: 1; fill: none; }
      .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    </style>
  </defs>

  <g class="c-gray">
    <rect x="40" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="63" text-anchor="middle" dominant-baseline="central">Test cases (xlsx)</text>
    <text class="ts" x="130" y="81" text-anchor="middle" dominant-baseline="central">Armenian, EN, RO — any language</text>
  </g>

  <line x1="130" y1="96" x2="130" y2="135" class="arr" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="40" y="135" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="158" text-anchor="middle" dominant-baseline="central">Planner (LLM)</text>
    <text class="ts" x="130" y="176" text-anchor="middle" dominant-baseline="central">Claude or OpenAI, swappable</text>
  </g>

  <line x1="220" y1="163" x2="259" y2="163" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="240" y="155" text-anchor="middle">plan</text>

  <g class="c-teal">
    <rect x="260" y="115" width="200" height="96" rx="8" stroke-width="0.5"/>
    <text class="th" x="360" y="138" text-anchor="middle" dominant-baseline="central">Executor (Playwright)</text>
    <text class="ts" x="360" y="158" text-anchor="middle" dominant-baseline="central">Accessibility-tree locators</text>
    <text class="ts" x="360" y="176" text-anchor="middle" dominant-baseline="central">Dry-run safety rails</text>
    <text class="ts" x="360" y="194" text-anchor="middle" dominant-baseline="central">PII masking in logs</text>
  </g>

  <g class="c-gray">
    <rect x="500" y="135" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="570" y="158" text-anchor="middle" dominant-baseline="central">TotoGaming.ro</text>
    <text class="ts" x="570" y="176" text-anchor="middle" dominant-baseline="central">via Romania VPN</text>
  </g>

  <line x1="460" y1="163" x2="499" y2="163" class="arr" marker-end="url(#arrow)"/>

  <path d="M 260 195 Q 200 235 130 220 L 130 191" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="180" y="240" text-anchor="middle">self-heal on failure</text>

  <line x1="360" y1="211" x2="360" y2="270" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="378" y="243" text-anchor="start">trace + final state</text>

  <g class="c-purple">
    <rect x="260" y="270" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="360" y="293" text-anchor="middle" dominant-baseline="central">Judge (LLM)</text>
    <text class="ts" x="360" y="311" text-anchor="middle" dominant-baseline="central">verdict + reasoning</text>
  </g>

  <line x1="360" y1="326" x2="360" y2="365" class="arr" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="200" y="365" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="275" y="388" text-anchor="middle" dominant-baseline="central">HTML report</text>
    <text class="ts" x="275" y="406" text-anchor="middle" dominant-baseline="central">For QA leads</text>
  </g>
  <g class="c-amber">
    <rect x="370" y="365" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="445" y="388" text-anchor="middle" dominant-baseline="central">JSON report</text>
    <text class="ts" x="445" y="406" text-anchor="middle" dominant-baseline="central">For CI / Slack / Jira</text>
  </g>

  <line x1="320" y1="350" x2="275" y2="365" stroke="#888780" stroke-width="0.5" fill="none"/>
  <line x1="400" y1="350" x2="445" y2="365" stroke="#888780" stroke-width="0.5" fill="none"/>
  <line x1="320" y1="350" x2="400" y2="350" stroke="#888780" stroke-width="0.5" fill="none"/>
  <line x1="360" y1="326" x2="360" y2="350" stroke="#888780" stroke-width="0.5" fill="none"/>

  <text class="ts" x="340" y="455" text-anchor="middle">Planner / Executor / Judge — the 2026 standard pattern for AI-driven test automation</text>
</svg>
